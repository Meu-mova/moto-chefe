name: CI

# Fase A do plano de staging/CI (docs/seguranca/2026-10-01-plano-staging-ci.md).
# Roda em PR para dev/main e em push em dev/main. Sem secrets: `npm run build`
# passa sem nenhuma env (verificado em 2026-10-01).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run type-check

      - run: npm test

      - run: npm run build

      # Aviso, não bloqueia: sem baseline ainda (ver plano §5.10, rollout do Biome
      # é item separado). Serve para acompanhar lib morta sem travar PR.
      - name: knip (arquivos e dependências não usados)
        run: npx knip
        continue-on-error: true

      # Aviso, não bloqueia: xlsx@0.18.5 tem CVE sem correção (relatório de
      # segurança 2026-09-30, item 6). Vira bloqueante quando for trocado.
      - name: npm audit (CVEs conhecidas)
        run: npm audit
        continue-on-error: true

  # Fluxos que gravam venda testados contra o schema real (baseline + migrações),
  # num Postgres descartável. Nasceu da #181: a efetivação de pedido falhava na
  # produção (rpc dependia de app.encryption_key) e nenhum teste via.
  banco:
    name: teste de banco (Postgres descartável)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # O migrate.ts aceita loopback sem --prod só com CI=true (scripts/lib/alvo-banco.ts).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: stubs do Supabase + baseline + migrações
        run: |
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -f supabase/ci-stubs.sql
          psql "$DATABASE_URL" -X -q -v ON_ERROR_STOP=1 -1 -f supabase/schema-baseline.sql
          node --import tsx scripts/migrate.ts --baseline-ate 110
          node --import tsx scripts/migrate.ts --aplicar

      - run: npm run test:db

  gitleaks:
    name: segredo no diff
    runs-on: ubuntu-latest
    # gitleaks-action lista os commits do PR pela API (GET .../pulls/{n}/commits);
    # sem isso dá 403 "Resource not accessible by integration" (visto no 1º run).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Grátis, mas repo de ORGANIZAÇÃO exige licença de gitleaks.io
          # (conta pessoal não precisa). Secret GITLEAKS_LICENSE cadastrado no
          # repo Meu-mova/moto-chefe em 2026-10-05; sem ele este step falha.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
