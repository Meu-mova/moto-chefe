name: Smoke do preview

# Fase 10 do plano de staging/CI (D17): quando a Vercel termina um preview (PR ou dev),
# entra com os usuários sintéticos e visita as telas principais (scripts/smoke.ts).
# O preview usa o staging (D6); a proteção da Vercel continua ligada e o robô passa
# pelo bypass de automação (docs/infra/staging.md, "Smoke").
on:
  deployment_status:

permissions:
  contents: read

jobs:
  # Versão do Playwright no lock do commit testado: a imagem do container acompanha o bump do
  # Dependabot sozinha (#704). Não há tag para trocar à mão.
  # Se a imagem dessa versão ainda não saiu no MCR quando o PR do Dependabot roda, o container
  # falha com "manifest unknown": espere a imagem sair e rode de novo (`gh run rerun <id>`).
  versao:
    name: versão do Playwright
    if: >-
      github.event.deployment_status.state == 'success' &&
      !contains(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.v.outputs.playwright }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false
      - id: v
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/playwright']?.version ?? ''")
          # Sem versão válida a tag sairia "v-noble" e o container falharia sem dizer por quê.
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão do Playwright não encontrada no package-lock.json (node_modules/playwright): '$v'"
            exit 1
          fi
          echo "playwright=$v" >> "$GITHUB_OUTPUT"

  smoke:
    name: smoke do preview
    needs: versao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Imagem oficial com Chromium e as libs do sistema já instaladas (#704): o
    # `playwright install --with-deps` baixava fontes pelo apt e chegava a 11 min.
    # --user 1001 como na doc do Playwright (playwright.dev/docs/ci, "Via Containers").
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.versao.outputs.playwright }}-noble
      options: --user 1001
    # O código vem do commit do deployment, e os secrets chegam ao script dele: quem tem
    # push no repo consegue lê-los (como no migracoes.yml). Ver docs/infra/segredos.md.
    # Um smoke por vez: todos batem no mesmo staging, e ~15 rodando juntos esgotaram o banco e
    # deram 500 em telas que não tinham mudado (26/10). Na fila o GitHub guarda só o mais novo.
    concurrency:
      group: smoke-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: smoke
        env:
          # Endereço do deployment. O smoke.ts recusa host que não seja preview do projeto.
          SMOKE_URL: ${{ github.event.deployment_status.environment_url }}
          SMOKE_SENHA: ${{ secrets.SMOKE_SENHA }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Preview: $SMOKE_URL"
          node --import tsx scripts/smoke.ts
