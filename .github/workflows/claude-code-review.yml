name: Revisão por IA

# D19 do plano de staging/CI e ADR 0006: o plugin code-review do Claude Code revisa os PRs
# para a dev e comenta no PR. O plugin pula rascunho, PR que julga trivial e PR que já tem
# comentário dele. É insumo, não bloqueio: a revisão humana continua (ADR 0002). Se falhar
# (token, cota), o check fica vermelho para avisar, mas não impede o merge.
# Doc: https://code.claude.com/docs/en/github-actions ("Run a skill").
on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: revisao-ia-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  revisar:
    name: revisão por IA
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Com github_token próprio, a action não precisa do Claude GitHub App instalado (que
    # pede escrita em workflows e actions); este token só lê o código e comenta no PR.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # A action configura a própria autenticação git; o token do checkout não precisa ficar.
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          # Token da assinatura do Luis; validade e riscos em docs/infra/segredos.md.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          # O allowedTools liga o servidor que posta comentário inline. --max-turns limita o
          # consumo da cota; ajustar depois das primeiras execuções (ADR 0006). O system prompt
          # extra traz a divisão de papéis do ADR 0006.
          claude_args: >-
            --max-turns 20
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "Divisão de papéis neste projeto (ADR 0006): você revisa bug local, padrões do repositório (CLAUDE.md e AGENTS.md), null, casos de borda e legibilidade. Design, regra de negócio, impacto no sistema e qualidade dos testes ficam com o revisor humano; não opine sobre eles. Escreva os comentários em português."
