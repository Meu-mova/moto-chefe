name: Navegação do preview

# #393: com o geral@ do seed, clica em cada item do menu nos temas claro e escuro e em 3
# larguras (scripts/navegacao-ci.ts). Só roda quando o PR do commit mexe em tela; não é
# check obrigatório. O preview usa o staging e passa pelo bypass, como o smoke.yml.
on:
  deployment_status:
  # Toda noite (03h de Brasília) contra a dev. Schedule só dispara pelo arquivo da main.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filtro:
    name: mexe em tela?
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       !contains(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rodar: ${{ steps.f.outputs.rodar }}
      rodar_acesso: ${{ steps.f.outputs.rodar_acesso }}
      url: ${{ steps.f.outputs.url }}
      ref: ${{ steps.f.outputs.ref }}
    steps:
      - id: f
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          SHA: ${{ github.event.deployment.sha }}
          URL_PREVIEW: ${{ github.event.deployment_status.environment_url }}
        run: |
          if [ "$EVENTO" != "deployment_status" ]; then
            echo "url=https://dev.meumova.com" >> "$GITHUB_OUTPUT"
            # Noturno testa a dev; disparo manual roda o script da ref escolhida, mas sempre
            # contra o site da dev (dev.meumova.com), não contra um preview dessa ref.
            if [ "$EVENTO" = "schedule" ]; then echo "ref=dev" >> "$GITHUB_OUTPUT"; else echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"; fi
            echo "rodar=true" >> "$GITHUB_OUTPUT"
            echo "rodar_acesso=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "url=$URL_PREVIEW" >> "$GITHUB_OUTPUT"
          echo "ref=$SHA" >> "$GITHUB_OUTPUT"
          arquivos=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[].number' |
            while read -r pr; do gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/files" --jq '.[].filename'; done)
          # Mesma regra do tocaTelas (scripts/lib/navegacao-ci.ts), mais o próprio teste.
          if printf '%s\n' "$arquivos" | grep -qE '^(src/(app|components)/.*|scripts/navegacao-ci\.ts|scripts/lib/navegacao-ci\.ts|scripts/e2e-acesso-rotas\.ts|scripts/lib/acesso-rotas\.ts|\.github/workflows/navegacao\.yml)$'; then
            echo "rodar=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum PR deste commit mexe em src/app, src/components ou no próprio teste; pulando."
            echo "rodar=false" >> "$GITHUB_OUTPUT"
          fi
          # Matriz rota x papel (#594): só quando o PR mexe em rota, permissão ou navegação.
          # Rota: page/layout de src/app; permissão: navegacao*.ts (usuarioPodeAcessar), o
          # AdminGuard, auth, grupo ativo, acesso por grupo, grupos liberados, middleware e src/lib/permissoes*.
          if printf '%s\n' "$arquivos" | grep -qE '^(src/app/.*/(page|layout)\.tsx|src/app/\(dashboard\)/admin/components/admin-guard\.tsx|src/lib/(navegacao|navegacao-servidor|auth|acesso-grupo|grupo|grupos-liberados)\.ts|src/lib/permissoes[^/]*|src/middleware\.ts|scripts/e2e-acesso-rotas\.ts|scripts/lib/acesso-rotas\.ts|\.github/workflows/navegacao\.yml)$'; then
            echo "rodar_acesso=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nenhum PR deste commit mexe em rota, permissão ou navegação; pulando a matriz rota x papel."
            echo "rodar_acesso=false" >> "$GITHUB_OUTPUT"
          fi

  navegacao:
    name: navegação ${{ matrix.larguras }}px
    needs: filtro
    if: needs.filtro.outputs.rodar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dois jobs, cada um numa vaga da fila própria: no máximo 2 sessões nossas no staging (com o
    # smoke, 3). Uma vaga por job: o GitHub guarda só 1 pendente por grupo, e dois jobs do mesmo
    # run na mesma vaga podiam cancelar um ao outro. Por isso 390 e 1280 vão em sequência num job.
    # Não é a fila do smoke pelo mesmo motivo: um run cancelaria o pendente do outro.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { larguras: '390 1280', vaga: a }
          - { larguras: '768', vaga: b }
    concurrency:
      group: navegacao-staging-${{ matrix.vaga }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.filtro.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Sem cache do Chromium: o actions/cache recusa o evento deployment_status.
      - run: npx playwright install --with-deps chromium

      - name: navegação
        env:
          # O navegacao-ci.ts recusa host que não seja preview do projeto ou dev.meumova.com.
          NAVEGACAO_URL: ${{ needs.filtro.outputs.url }}
          SMOKE_SENHA: ${{ secrets.SMOKE_SENHA }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          LARGURAS: ${{ matrix.larguras }}
          # Até a fase 5 da #90 o escuro só reporta; ligar NAVEGACAO_ESCURO_FALHA na fase 5 da #90.
          NAVEGACAO_ESCURO_FALHA: '0'
        run: |
          echo "Alvo: $NAVEGACAO_URL"
          falhou=0
          for l in $LARGURAS; do
            node --import tsx scripts/navegacao-ci.ts --largura "$l" --prints prints || falhou=1
          done
          exit $falhou

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navegacao-${{ matrix.vaga }}
          path: prints/
          retention-days: 7
          if-no-files-found: ignore

  # #579: cada papel do seed abre pela URL cada rota da tabela de navegação. Sem permissão
  # volta ao /dashboard sem tela de erro; com permissão a tela abre. Rota nova entra sozinha.
  acesso:
    name: acesso rota x papel
    needs: filtro
    if: needs.filtro.outputs.rodar_acesso == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    # #594: o grupo único do repo guardava só 1 pendente e cancelava o PR do lado. Agora o grupo
    # é por branch do preview (commit novo do mesmo PR cancela o antigo) e, fora do preview, por
    # execução. Uma matriz por vez no staging continua valendo (carga, como no smoke.yml): quem
    # garante é o passo "esperar a vez", em fila por run_id, sem cancelar ninguém.
    concurrency:
      group: navegacao-acesso-${{ github.event_name == 'deployment_status' && github.event.deployment.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: esperar a vez
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          limite=$(( $(date +%s) + 60 * 60 ))
          while :; do
            frente=""
            for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/navegacao.yml/runs?per_page=100" \
                --jq "[.workflow_runs[] | select(.status != \"completed\" and .id < $GITHUB_RUN_ID) | .id] | sort | .[]"); do
              # Sem job da matriz: pula só se o filtro já concluiu (matriz pulada); run na fila sem job
              # nenhum conta como na frente. Job criado e não concluído: está na frente.
              pendente=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '
                ([.jobs[] | select(.name == "acesso rota x papel")] | if length == 0 then "sem-job" else (.[0].status) end)')
              if [ "$pendente" != "completed" ]; then
                filtro=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '[.jobs[] | select(.name == "mexe em tela?")][0].status // "queued"')
                if [ "$pendente" = "sem-job" ] && [ "$filtro" = "completed" ]; then continue; fi
                frente=$run; break
              fi
            done
            if [ -z "$frente" ]; then echo "Vez desta execução; seguindo."; break; fi
            if [ "$(date +%s)" -ge "$limite" ]; then
              echo "::error::Esperou 60 min pela matriz da execução $frente sem terminar. Rode de novo quando ela acabar."
              exit 1
            fi
            echo "$(date -u +%H:%M:%S) Esperando a matriz da execução na frente: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$frente"
            sleep 30
          done

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.filtro.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: matriz rota x papel
        env:
          NAVEGACAO_URL: ${{ needs.filtro.outputs.url }}
          SMOKE_SENHA: ${{ secrets.SMOKE_SENHA }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          echo "Alvo: $NAVEGACAO_URL"
          node --import tsx scripts/e2e-acesso-rotas.ts
