name: Conciliação Cartão

on:
  schedule:
    # 13h BRT = 16h UTC
    - cron: '0 16 * * 1-6'
    # 17h BRT = 20h UTC
    - cron: '0 20 * * 1-6'
  workflow_dispatch: # permite rodar manualmente

jobs:
  infinitypay:
    name: InfinityPay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar e enviar transações InfinityPay
        run: node scripts/conciliacao/infinitypay.mjs
        env:
          INFINITYPAY_API_BASE:   ${{ secrets.INFINITYPAY_API_BASE }}
          INFINITYPAY_SALES_PATH: ${{ secrets.INFINITYPAY_SALES_PATH }}
          INFINITYPAY_TOKEN:      ${{ secrets.INFINITYPAY_TOKEN }}
          MOVA_URL:               ${{ secrets.MOVA_URL }}
          CRON_SECRET:            ${{ secrets.CRON_SECRET }}
